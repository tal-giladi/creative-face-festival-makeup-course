<text x="87" y="245" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">1. Lead line in one slow stroke.</text>
<text x="87" y="251" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">2. Second line at the same gap, then the next.</text>
<text x="87" y="257" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">3. Fill the lanes with color, then black lines again.</text>
<text x="87" y="263" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">4. Thin white highlight in the lightest band.</text>
