<title>Waves and nested lines</title>
<rect width="210" height="297" fill="#fff"/>
<text x="12" y="16" font-family="Helvetica,Arial,sans-serif" font-size="4.6" fill="#1f2a44" text-anchor="start" font-weight="700">Waves and nested lines</text>
<text x="12" y="21.5" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#9aa1ad" text-anchor="start">Paint over each gray lead line, then nest 3 to 5 lines beside it at the same gap (the dotted line shows the first gap). Lesson 07.3.</text>
