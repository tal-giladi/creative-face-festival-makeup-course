<rect x="12" y="31" width="186" height="98" fill="none" stroke="#9aa1ad" stroke-width="0.35"/>
<text x="12" y="139" font-family="Helvetica,Arial,sans-serif" font-size="3.6" fill="#1f2a44" text-anchor="start" font-weight="700">The rub test</text>
<text x="12" y="146" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">1. Paint the patch and let it dry until it is no longer shiny.</text>
<text x="12" y="151.5" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">2. Set it (or not), as the row says. Wait 10 minutes.</text>
<text x="12" y="157" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">3. Press a clean tissue on the patch for 3 seconds. Look at the tissue.</text>
<text x="12" y="162.5" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">4. Rub the patch gently with a fingertip, 5 times. Look at the edges.</text>
<text x="12" y="168" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">5. Optional: blow warm breath on it or hold a damp cloth near it for a minute, then repeat.</text>
<text x="12" y="179.5" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="#1f2a44" text-anchor="start" font-weight="700">Where the patches go on your forearm</text>
