<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Glitter label check</title>
<rect width="210" height="297" fill="#fff"/>
<text x="12" y="16" font-family="Helvetica,Arial,sans-serif" font-size="4.6" fill="#1f2a44" text-anchor="start" font-weight="700">Glitter label check</text>
<text x="12" y="21.5" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#9aa1ad" text-anchor="start">One row per glitter, gel or gem glue you own. Lesson 06.1 (and 06.3 for glues).</text>
<text x="146" y="16" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#9aa1ad" text-anchor="end">Name:</text>
<line x1="148" y1="16.6" x2="198" y2="16.6" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="287" x2="112" y2="287" stroke="#9aa1ad" stroke-width="0.35"/>
<line x1="12" y1="284.8" x2="12" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="22" y1="285.8" x2="22" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="32" y1="285.8" x2="32" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="42" y1="285.8" x2="42" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="52" y1="285.8" x2="52" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="62" y1="284.8" x2="62" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="72" y1="285.8" x2="72" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="82" y1="285.8" x2="82" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="92" y1="285.8" x2="92" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="102" y1="285.8" x2="102" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="112" y1="284.8" x2="112" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="115" y="287.8" font-family="Helvetica,Arial,sans-serif" font-size="2.5" fill="#9aa1ad" text-anchor="start">Must measure 10 cm. If not, print at 100% ("Actual size").</text>
<rect x="12" y="31" width="186" height="10" fill="#f1f3f5"/>
<text x="13.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Product</text>
<line x1="12" y1="31" x2="12" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<text x="53.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Sold for skin?</text>
<line x1="52" y1="31" x2="52" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<text x="75.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Ingredient</text>
<text x="75.5" y="38.4" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">list?</text>
<line x1="74" y1="31" x2="74" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<text x="97.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Flakes: plastic /</text>
<text x="97.5" y="38.4" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">plant / mica / ?</text>
<line x1="96" y1="31" x2="96" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<text x="129.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Eye warning?</text>
<line x1="128" y1="31" x2="128" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<text x="151.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Patch test: date and</text>
<text x="151.5" y="38.4" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">result</text>
<line x1="150" y1="31" x2="150" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<text x="181.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Use it?</text>
<line x1="180" y1="31" x2="180" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="198" y1="31" x2="198" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="41" x2="198" y2="41" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="55" x2="198" y2="55" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="69" x2="198" y2="69" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="83" x2="198" y2="83" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="97" x2="198" y2="97" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="111" x2="198" y2="111" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="125" x2="198" y2="125" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="139" x2="198" y2="139" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="153" x2="198" y2="153" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="167" x2="198" y2="167" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="181" x2="198" y2="181" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="195" x2="198" y2="195" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="209" x2="198" y2="209" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="223" x2="198" y2="223" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="237" x2="198" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="251" x2="198" y2="251" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="31" x2="198" y2="31" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="257" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Sold for skin: the pack or seller says cosmetic glitter, face and body, or makeup. No: craft glitter. Never on skin.</text>
<text x="12" y="261.6" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Ingredient list: no list means not for skin. Plastic glitter often says polyethylene terephthalate (PET) or polyester.</text>
<text x="12" y="266.2" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Eye warning: believe it. Beginners keep all glitter and gems off the eyelids and lash line anyway.</text>
<text x="12" y="270.8" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Patch test: inner arm, wear it as long as a design, then watch 24-48 hours (lesson 01.3).</text>
</svg>
