<line x1="52" y1="268.2" x2="52" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="62" y1="267.2" x2="62" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="72" y1="268.2" x2="72" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="82" y1="268.2" x2="82" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="92" y1="268.2" x2="92" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="102" y1="268.2" x2="102" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="112" y1="267.2" x2="112" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="115" y="270.2" font-family="Helvetica,Arial,sans-serif" font-size="2.5" fill="#9aa1ad" text-anchor="start">Must measure 10 cm. If not, print at 100% ("Actual size").</text>
<rect x="12" y="31" width="191.9" height="10" fill="#f1f3f5"/>
<text x="13.5" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Product</text>
<line x1="12" y1="31" x2="12" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<text x="54.77" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Sold for skin?</text>
<line x1="53.27" y1="31" x2="53.27" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<text x="77.47" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Ingredient</text>
<text x="77.47" y="38.4" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">list?</text>
<line x1="75.97" y1="31" x2="75.97" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<text x="100.16" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Flakes: plastic /</text>
<text x="100.16" y="38.4" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">plant / mica / ?</text>
<line x1="98.66" y1="31" x2="98.66" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<text x="133.18" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Eye warning?</text>
<line x1="131.68" y1="31" x2="131.68" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<text x="155.88" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Patch test: date and</text>
<text x="155.88" y="38.4" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">result</text>
<line x1="154.38" y1="31" x2="154.38" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<text x="186.83" y="35.2" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#1f2a44" text-anchor="start" font-weight="700">Use it?</text>
<line x1="185.33" y1="31" x2="185.33" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="203.9" y1="31" x2="203.9" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="41" x2="203.9" y2="41" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="55" x2="203.9" y2="55" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="69" x2="203.9" y2="69" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="83" x2="203.9" y2="83" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="97" x2="203.9" y2="97" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="111" x2="203.9" y2="111" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="125" x2="203.9" y2="125" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="139" x2="203.9" y2="139" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="153" x2="203.9" y2="153" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="167" x2="203.9" y2="167" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="181" x2="203.9" y2="181" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="195" x2="203.9" y2="195" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="209" x2="203.9" y2="209" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="223" x2="203.9" y2="223" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="237" x2="203.9" y2="237" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="31" x2="203.9" y2="31" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="243" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Sold for skin: the pack or seller says cosmetic glitter, face and body, or makeup. No: craft glitter. Never on skin.</text>
<text x="12" y="247.6" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Ingredient list: no list means not for skin. Plastic glitter often says polyethylene terephthalate (PET) or polyester.</text>
<text x="12" y="252.2" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Eye warning: believe it. Beginners keep all glitter and gems off the eyelids and lash line anyway.</text>
<text x="12" y="256.8" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">Patch test: inner arm, wear it as long as a design, then watch 24-48 hours (lesson 01.3).</text>
</svg>
