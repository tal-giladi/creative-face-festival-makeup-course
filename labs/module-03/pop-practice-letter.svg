<text x="12" y="21.5" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#9aa1ad" text-anchor="start">Fill, let dry, outline thin-thick (thicker away from the sun), then white on the sun side. Lesson 03.3.</text>
