<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Module 1 practical: paint, remove, clean</title>
<rect width="210" height="297" fill="#fff"/>
<text x="12" y="16" font-family="Helvetica,Arial,sans-serif" font-size="4.6" fill="#1f2a44" text-anchor="start" font-weight="700">Module 1 practical: paint, remove, clean</text>
<text x="12" y="21.5" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#9aa1ad" text-anchor="start">Record your arm patch from start to finish. Lesson 01.5.</text>
<text x="146" y="16" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#9aa1ad" text-anchor="end">Name:</text>
<line x1="148" y1="16.6" x2="198" y2="16.6" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="287" x2="112" y2="287" stroke="#9aa1ad" stroke-width="0.35"/>
<line x1="12" y1="284.8" x2="12" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="22" y1="285.8" x2="22" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="32" y1="285.8" x2="32" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="42" y1="285.8" x2="42" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="52" y1="285.8" x2="52" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="62" y1="284.8" x2="62" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="72" y1="285.8" x2="72" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="82" y1="285.8" x2="82" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="92" y1="285.8" x2="92" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="102" y1="285.8" x2="102" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="112" y1="284.8" x2="112" y2="287" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="115" y="287.8" font-family="Helvetica,Arial,sans-serif" font-size="2.5" fill="#9aa1ad" text-anchor="start">Must measure 10 cm. If not, print at 100% ("Actual size").</text>
<text x="12" y="31" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Date</text>
<line x1="64" y1="31.6" x2="198" y2="31.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="42" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Paint and colors used</text>
<line x1="64" y1="42.6" x2="198" y2="42.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="53" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Patch-tested? (date)</text>
<line x1="64" y1="53.6" x2="198" y2="53.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="64" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Water: little / some / lots</text>
<line x1="64" y1="64.6" x2="198" y2="64.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="75" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Time worn (minutes)</text>
<line x1="64" y1="75.6" x2="198" y2="75.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="86" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Removed with</text>
<line x1="64" y1="86.6" x2="198" y2="86.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="97" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Color left after wiping?</text>
<line x1="64" y1="97.6" x2="198" y2="97.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="108" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">Skin afterwards</text>
<line x1="64" y1="108.6" x2="198" y2="108.6" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="64" y1="116.6" x2="198" y2="116.6" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="129" font-family="Helvetica,Arial,sans-serif" font-size="3.4" fill="#1f2a44" text-anchor="start" font-weight="700">Clean-up checklist</text>
<rect x="12" y="132.6" width="4" height="4" fill="none" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="19" y="136" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start">Arm clean, no color left, patted dry</text>
<rect x="12" y="140.6" width="4" height="4" fill="none" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="19" y="144" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start">Brushes rinsed, soaped, rinsed clear, tips reshaped</text>
<rect x="12" y="148.6" width="4" height="4" fill="none" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="19" y="152" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start">Brushes drying flat on a towel</text>
<rect x="12" y="156.6" width="4" height="4" fill="none" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="19" y="160" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start">Sponges washed, squeezed, drying in open air</text>
<rect x="12" y="164.6" width="4" height="4" fill="none" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="19" y="168" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start">Plate, cups and table wiped</text>
<rect x="12" y="172.6" width="4" height="4" fill="none" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="19" y="176" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start">Paint cakes air-dried, then lids closed</text>
<rect x="12" y="180.6" width="4" height="4" fill="none" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="19" y="184" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start">Hands washed</text>
<text x="12" y="194" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#1f2a44" text-anchor="start" font-weight="700">What I will do differently next time</text>
<line x1="64" y1="194.6" x2="198" y2="194.6" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="64" y1="202.6" x2="198" y2="202.6" stroke="#c9ced6" stroke-width="0.25"/>
</svg>
