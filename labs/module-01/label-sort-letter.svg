<line x1="12" y1="132.7" x2="203.9" y2="132.7" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="148.48" x2="203.9" y2="148.48" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="164.27" x2="203.9" y2="164.27" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="180.05" x2="203.9" y2="180.05" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="195.83" x2="203.9" y2="195.83" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="211.62" x2="203.9" y2="211.62" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="227.4" x2="203.9" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="29" x2="203.9" y2="29" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="12" y1="29" x2="12" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<line x1="203.9" y1="29" x2="203.9" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<text x="12" y="233.4" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#1f2a44" text-anchor="start">Not for skin, always: acrylic or craft paint, markers, craft glitter, any glue not sold for skin, "black henna", kohl.</text>
<text x="12" y="239.4" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#1f2a44" text-anchor="start">Eye area only if the label allows it. Neon / fluorescent and glow-in-the-dark: never near the eyes.</text>
<text x="12" y="245.4" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#9aa1ad" text-anchor="start">No ingredient list, or not sold as a cosmetic? Then it stays off skin.</text>
</svg>
