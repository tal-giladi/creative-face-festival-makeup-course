<line x1="72" y1="268.2" x2="72" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="82" y1="268.2" x2="82" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="92" y1="268.2" x2="92" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="102" y1="268.2" x2="102" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<line x1="112" y1="267.2" x2="112" y2="269.4" stroke="#9aa1ad" stroke-width="0.3"/>
<text x="115" y="270.2" font-family="Helvetica,Arial,sans-serif" font-size="2.5" fill="#9aa1ad" text-anchor="start">Must measure 10 cm. If not, print at 100% ("Actual size").</text>
<rect x="12" y="29" width="191.9" height="9" fill="#f1f3f5"/>
<text x="14" y="35" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#1f2a44" text-anchor="start" font-weight="700">Product</text>
<line x1="69.57" y1="29" x2="69.57" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<text x="71.57" y="35" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#1f2a44" text-anchor="start" font-weight="700">Face paint?</text>
<line x1="98.35" y1="29" x2="98.35" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<text x="100.35" y="35" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#1f2a44" text-anchor="start" font-weight="700">Ingredients?</text>
<line x1="127.14" y1="29" x2="127.14" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<text x="129.14" y="35" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#1f2a44" text-anchor="start" font-weight="700">Skin</text>
<line x1="146.33" y1="29" x2="146.33" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<text x="148.33" y="35" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#1f2a44" text-anchor="start" font-weight="700">Eye area</text>
<line x1="169.36" y1="29" x2="169.36" y2="227.4" stroke="#c9ced6" stroke-width="0.25"/>
<text x="171.36" y="35" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#1f2a44" text-anchor="start" font-weight="700">Not for skin</text>
