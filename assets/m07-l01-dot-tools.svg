<title id="p0t">Five tools and the dots they make, smallest to biggest. Brush tip: tiny dots. Small end of a dotting tool: small dots. Brush handle end: medium dots. Big end of a dotting tool: big dots. Cotton swab: extra big, soft dots. Each tool makes rows of the same size when you dip it again before every dot.</title>
