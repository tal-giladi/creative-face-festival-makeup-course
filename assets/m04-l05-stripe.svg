<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 198" width="890" height="198" role="img" aria-labelledby="s57t">
<title id="s57t">A tiger stripe in three moves. 1: press the brush down hard at the edge, so the stroke starts wide. 2: pull inward and lift slowly, so it narrows to a sharp point. 3: for a forked stripe, start a second shorter stroke from the middle of the first. Done: stripes of different lengths, never all the same.</title>
