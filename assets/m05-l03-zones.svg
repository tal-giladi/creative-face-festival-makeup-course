<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="p26t">
<title id="p26t">The festival face map on tan skin, with five zones. 1, purple: an arc from above the inner brow, over the brow, to the temple. 2, teal: a line along the cheekbone, from under the eye out and up toward the temple. 3, pink: the third eye, a small spot on the forehead center line just above the brows. 4, yellow: a band along the hairline. 5, orange: the chin, on the center line. Red dashed ovals mark the eye area around each eye, covered in lesson 05.4.</title>
