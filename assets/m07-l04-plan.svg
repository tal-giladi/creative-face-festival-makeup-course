<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="940" height="510" role="img" aria-labelledby="p43t">
<title id="p43t">A filled-in design plan for a festival look. Left: a face map sketch with the eye area marked in red dashes and four numbered parts: 1, a dot mandala on the forehead center, the star zone; 2, geometric lines over the brows; 3, dot arcs along the cheekbones; 4, glitter on the upper cheekbones and gems, added last. Right: the palette, purple as the main color, magenta second, cyan as the accent, black for lines and white for details; the list of parts; and the timing, about 80 minutes: prep 10, color 20, lines 15, dots 15, eye makeup 5, setting 5 and glitter and gems 10 minutes.</title>
<rect width="940" height="510" fill="#fbf8f4"/>
