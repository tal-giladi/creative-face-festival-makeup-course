<title id="s13t">Three paint consistencies side by side. Too wet: a shiny puddle on the cake and a pale, see-through line that drips. Just right: a creamy top like melted ice cream and a smooth, solid line. Too dry: a dry, cracked cake and a scratchy, broken line.</title>
