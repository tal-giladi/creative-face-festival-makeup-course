<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="p26t">
<title id="p26t">Which glue for which gem. Self-adhesive face gems need no glue. Latex-free eyelash glue holds small loose gems. Spirit gum or a prosthetic adhesive such as Pros-Aide holds bigger pieces on the face and body but never near the eyes; spirit gum and its remover are flammable. Never superglue, nail glue, craft glue or school glue on skin.</title>
