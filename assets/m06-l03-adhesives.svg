s, face and</text><text x="391" y="294" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">body. Not near the eyes.</text><path d="M609 100H641L637 180H613Z" fill="#fff5f5" stroke="#495057" stroke-width="1.6"/><rect x="619" y="80" width="12" height="20" fill="#495057"/><path d="M623 70L625 64L627 70V80H623Z" fill="#495057"/><rect x="660" y="110" width="40" height="70" rx="6" fill="#fff9db" stroke="#495057" stroke-width="1.6"/><rect x="670" y="88" width="20" height="22" rx="3" fill="#495057"/><path d="M647 214l16 16M663 214l-16 16" stroke="#e03131" stroke-width="4" stroke-linecap="round"/><text x="655" y="254" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Superglue, nail, craft glue</text><text x="655" y="254" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#e03131">Superglue, nail, craft glue</text><text x="581" y="276" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">Never on skin.</text><text x="581" y="294" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">Not even "just a dot".</text>
