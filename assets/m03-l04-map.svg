<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="p13t">
<title id="p13t">The face map on a medium skin tone. A red dashed center line runs down the middle of the forehead, nose, lips and chin. Blue dashed lines cross the face at the brows, the eyes, under the nose and at the mouth. Red circles mark the landmarks on both sides: 1 the end of the brow, 2 the outer eye corner, 3 the cheekbone, 4 the mouth corner, and 5 the chin on the center line.</title>
