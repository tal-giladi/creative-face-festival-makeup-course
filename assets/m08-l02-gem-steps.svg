<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 249" width="1064" height="249" role="img" aria-labelledby="s8t">
<title id="s8t">A 3D gem on paper in five pictures, light from the top left. 1: sketch a hexagon, a smaller hexagon inside it for the flat top, and lines joining the corners. 2: fill everything with the midtone blue. 3: paint the facets on the bottom right with a darker blue. 4: paint the facets on the top left and the top with a lighter blue. Done: a white shine along the top-left edge, a white sparkle, a thin dark outline and a soft cast shadow on the bottom right.</title>
