<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 304" width="776" height="304" role="img" aria-labelledby="s20t">
<title id="s20t">The same yellow star with orange and pink dots on three skin tones. Light skin: the colors show clearly. Deep skin, painted straight on: the yellow and orange look thin and see-through. Deep skin with a thin layer of white painted underneath first and left to dry: the same colors are bright and solid. All three have a thin black outline and a white highlight.</title>
