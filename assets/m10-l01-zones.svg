<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 760" width="456" height="760" role="img" aria-labelledby="p4t">
<title id="p4t">Body map on light skin. Green, easy places: 1 the shoulder cap, 2 the outer upper arm, 3 the collarbone, 4 the outer forearm and back of the hand. Orange, places that need care: 5 the inside of the elbow, which bends and cracks paint, 6 the armpit, which sweats, 7 the palm and the inner sides of the fingers, which rub off, 8 the edge of clothing, which rubs and can stain.</title>
