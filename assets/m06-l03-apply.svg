<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 214" width="804" height="214" role="img" aria-labelledby="s35t">
<title id="s35t">Sticking a loose gem in four steps. 1: put a tiny dot of latex-free lash glue on the flat back of the gem, not on the face. 2: wait about 30 seconds until the glue turns clear or tacky. 3: press the gem on clean, dry skin with tweezers or a clean fingertip and hold for 10 seconds. Removal: hold the skin, lift the gem from one edge after softening it with an oil cleanser; never pull hard.</title>
