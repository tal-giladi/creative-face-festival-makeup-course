<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 242" width="840" height="242" role="img" aria-labelledby="s39t">
<title id="s39t">A good gem line and three mistakes. Good: gems above the brow, graded in size, ending at the temple. Avoid: gems on the eyelid and lash line, where they can fall into the eye. Avoid: a crooked line placed without dots. Avoid: superglue or craft glue from the drawer.</title>
