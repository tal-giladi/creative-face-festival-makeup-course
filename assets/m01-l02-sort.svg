<title id="p3t">Three groups. Skin: yes — face paint, cosmetic glitter gel, neon face paint (not near the eyes). Eye area: yes — products whose label allows eye use, such as an eye-safe pencil. Not for skin — acrylic craft paint, markers, craft glitter, glue and black henna.</title>
