<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 410" width="740" height="410" role="img" aria-labelledby="p7t">
<title id="p7t">Value ladders for purple, teal and orange. From left to right: a highlight with lots of white, a lighter tint, the plain color as the midtone, a darker shade of the same color for the shadow, and a deeper shade. On the right, two teal balls: the good one is shaded with dark teal and looks clean and round; the other is shaded with black and looks gray and dirty.</title>
<rect width="740" height="410" fill="#fbf8f4"/>
