<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="p6t">
<title id="p6t">The five parts of light on a purple ball, with the light coming from the top left. 1 Highlight: a small white shine on the top left. 2 Midtone: the plain color across the middle. 3 Shadow: a darker shade of the same purple on the bottom right. 4 Reflected light: a slightly lighter band just inside the bottom-right edge. 5 Cast shadow: a soft dark oval on the ground beside the ball, away from the light.</title>
