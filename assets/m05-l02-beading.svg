<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 214" width="806" height="214" role="img" aria-labelledby="s22t">
<title id="s22t">The same purple stripe painted on three forearms with fair skin. Avoid: oily skin that was not cleaned: the paint goes on patchy and slides. Avoid: heavy cream that is still wet: the water-based paint pulls into little beads with bare skin between them. Good: a light moisturizer that has soaked in until the skin feels dry: the stripe is smooth and even.</title>
