<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 253" width="858" height="253" role="img" aria-labelledby="s12t">
<title id="s12t">Clothes and body paint, on medium skin with a gray-blue tank top. Avoid: paint under a strap, which rubs off and stains the strap pink. Avoid: a design that runs into the neckline, so the edge of the top rubs it and gets stained. Good: a necklace with wings on the collarbones and shoulder caps, between the straps and above the neckline, left to dry before dressing.</title>
