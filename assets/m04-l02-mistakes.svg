<title id="s20t">A good star and three common mistakes. Good: five even arms and sharp tips. Avoid: one arm too long, so the star looks lopsided. Avoid: round, blunt tips from pressing too hard at the start. Avoid: a black outline painted while the yellow was still wet, so it turned muddy.</title>
