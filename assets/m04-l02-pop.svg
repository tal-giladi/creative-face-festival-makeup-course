<title id="s12t">Hearts, sparkles and a star that pops. Heart: 1 one curved teardrop from the top left down to the point, 2 a mirror teardrop from the top right, then a thin black outline and a white shine. Sparkle: 1 a long up-down pressure stroke, 2 a shorter side-to-side stroke across it. Done: a star with a black outline, a white shine and a sparkle cluster.</title>
