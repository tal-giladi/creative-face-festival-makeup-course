<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1154 249" width="1154" height="249" role="img" aria-labelledby="s3t">
<title id="s3t">Mixing on the plate in five pictures. 1: put a pool of the light color, yellow, on the plate. 2: put a small dot of the dark color, blue, beside it, not on top. 3: pull a little blue into the yellow with the brush and stir. 4: paint a test swatch on paper and compare. Done: a clean green, with yellow and blue still separate at the side.</title>
