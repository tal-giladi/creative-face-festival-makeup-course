<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="p11t">
<title id="p11t">Four geometric shapes, each built from anchor dots. Top row: the gray anchor dots and light guide lines. Bottom row: the finished shape. Triangle: three corner dots, an orange triangle with a yellow triangle inside, black outlines. Chevrons: three dots for each V, stacked; magenta, orange, yellow and lime V shapes with thin black lines. Diamond: four dots on a cross, split into four triangles of teal and cyan with a black outline. Star in a circle: six dots around a circle like a clock at 12, 2, 4, 6, 8 and 10; join every second dot to make two triangles, a six-point star, inside a purple circle.</title>
