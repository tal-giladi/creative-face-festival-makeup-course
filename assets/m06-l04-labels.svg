<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-labelledby="p45t">
<title id="p45t">Three neon labels. UV face and body paint, a cosmetic with an ingredient list, labeled do not use in the eye area: face away from the eyes, and body. UV body paint, a cosmetic labeled for body use only, not for the face: body only. Craft UV paint or a Special FX neon labeled not a cosmetic, for paper, fabric or props: never on skin.</title>
<rect width="780" height="320" fill="#fbf8f4"/>
