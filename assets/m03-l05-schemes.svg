<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 307" width="900" height="307" role="img" aria-labelledby="s17t">
<title id="s17t">Four kinds of color combination on the color wheel. Analogous: three neighbors, here red, orange and yellow. Complementary: two opposites, here blue and orange. Monochrome plus accent: light, middle and dark purple with one small yellow accent. Warm and cool: the warm half of the wheel is red, orange and yellow; the cool half is green, blue and purple.</title>
