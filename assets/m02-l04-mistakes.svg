<title id="s20t">Good dots and three mistakes. Good: round dots of the same size, evenly spaced. Avoid: dots with little tails, because the tool slid while lifting. Avoid: dots of random sizes, because some were dipped again and some were not. Avoid: dots that run together, because they are too wet and too close.</title>
