<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="p41t">
<title id="p41t">Where neon may go. Green zones: the forehead above the brows, the temples outside the eye area, the cheeks below the eye area, the jaw and the body. Red hatched zone: the whole eye area, from the brows to the skin under the eyes, where no fluorescent, UV or glow-in-the-dark paint goes. Near the eyes use only ordinary, non-fluorescent paint whose label allows the eye area.</title>
