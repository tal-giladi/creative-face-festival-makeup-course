fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Neon / UV face paint: yes</text><text x="384" y="67" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">Neon / UV face paint: yes</text><text x="384" y="92" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14.5" fill="#2b2f3a">forehead, temples, cheeks,</text><text x="384" y="112" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14.5" fill="#2b2f3a">jaw, body (if the label allows)</text><defs><pattern id="hzkey3" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="9" height="9" fill="#e03131" opacity="0.12"/><line x1="0" y1="0" x2="0" y2="9" stroke="#e03131" stroke-width="3" opacity="0.55"/></pattern></defs><rect x="350" y="150" width="22" height="22" rx="4" fill="url(#hzkey3)" stroke="#e03131" stroke-width="2" stroke-dasharray="5 4"/><text x="384" y="167" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Eye area: no neon, no UV,</text><text x="384" y="167" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#e03131">Eye area: no neon, no UV,</text><text x="384" y="192" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14.5" fill="#e03131">no glow-in-the-dark</text><text x="384" y="212" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14.5" fill="#e03131">brows, eyelids, under the eyes</text><rect x="350" y="250" width="22" height="22" rx="4" fill="#9775fa"/><text x="384" y="267" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Near the eyes:</text><text x="384" y="267" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">Near the eyes:</text><text x="384" y="292" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14.5" fill="#2b2f3a">ordinary eye-safe colors</text><text x="384" y="312" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14.5" fill="#2b2f3a">(not fluorescent) only</text><text x="350" y="360" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#6b7280">US FDA: no fluorescent colors are</text><text x="350" y="380" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#6b7280">allowed near the eyes.</text>
