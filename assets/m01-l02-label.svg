<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460" role="img" aria-labelledby="p4t">
<title id="p4t">An example face paint label with four things to check: 1 it says face and body paint, a cosmetic; 2 it has an ingredient list; 3 the colors are listed as CI numbers such as CI 77891 and CI 77491; 4 the warning says where it may not go, here not near the eyes.</title>
<rect width="840" height="460" fill="#fbf8f4"/>
<rect x="60" y="40" width="380" height="380" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="60" y="40" width="380" height="64" rx="12" fill="#7b3fc4"/><rect x="60" y="80" width="380" height="24" fill="#7b3fc4"/><text x="250" y="81" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">FACE &amp; BODY PAINT</text><text x="86" y="136" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">Water-activated  ·  cosmetic  ·  30 g</text><text x="86" y="180" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">Ingredients:</text><text x="86" y="204" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">Aqua, Glycerin, Talc, Kaolin,</text><rect x="82" y="212" width="176" height="24" rx="4" fill="#fff3bf"/><text x="86" y="229" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">CI 77891, CI 77491</text><rect x="78" y="262" width="344" height="92" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/><text x="86" y="288" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#e03131">Warning:</text><text x="86" y="312" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">Not for use near the eyes.</text><text x="86" y="336" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">Patch test before use.</text><text x="86" y="390" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">Wash off with soap and water.</text><circle cx="500" cy="80" r="15" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="500" y="85.7" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#d6336c">1</text><path d="M484 80L432 72" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round"/><path d="M439.6 69.7L432 72L438.6 76.5" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="77" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2b2f3a">Face or body paint?</text><text x="526" y="99" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">sold as a cosmetic</text><circle cx="500" cy="170" r="15" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="500" y="175.7" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#d6336c">2</text><path d="M484 170L210 180" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round"/><path d="M217.1 176.3L210 180L217.3 183.2" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="167" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2b2f3a">Ingredient list?</text><text x="526" y="189" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">no list: not on skin</text><circle cx="500" cy="250" r="15" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="500" y="255.7" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#d6336c">3</text><path d="M484 250L264 224" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round"/><path d="M271.6 221.4L264 224L270.7 228.3" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="247" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2b2f3a">Colors as CI numbers</text><text x="526" y="269" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">look them up in CosIng</text><circle cx="500" cy="340" r="15" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="500" y="345.7" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#d6336c">4</text><path d="M484 340L432 302" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round"/><path d="M439.9 303.4L432 302L435.8 309.1" fill="none" stroke="#c2b8ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="337" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2b2f3a">Where may it go?</text><text x="526" y="359" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">believe "not near eyes"</text>
</svg>
