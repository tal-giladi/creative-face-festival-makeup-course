<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 344" width="598" height="344" role="img" aria-labelledby="s29t">
<title id="s29t">Placement that lifts the face and placement that drags it down, on light skin. Good: teardrops and dots start under the outer eye, follow the cheekbone and sweep up and out toward the temples, so the face looks lifted and awake. Avoid: the same teardrops and dots placed low on the cheeks and pointing down toward the jaw, so the face looks tired and droopy.</title>
