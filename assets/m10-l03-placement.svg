<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-labelledby="p9t">
<title id="p9t">Placement guides on the upper body, on fair skin. 1: the center line runs down from the middle of the neck. 2: the collarbones, marked with a dashed line. 3: the notch between the collarbones, on the center line. 4: the shoulder caps, the round top of each shoulder, shaded green. 5: the neckline, a dotted line where clothes usually start.</title>
<rect width="520" height="360" fill="#fbf8f4"/>
