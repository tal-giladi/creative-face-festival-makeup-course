<title id="s8t">A good teardrop and three mistakes. Good: round head and a long, sharp tail. Avoid: a blob with no tail, because the brush stopped before lifting. Avoid: a hooked tail, because the brush was flicked sideways. Avoid: petals of different sizes with big gaps.</title>
