<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 284" width="930" height="284" role="img" aria-labelledby="s1t">
<title id="s1t">Placing an even ring of 16 dots by quarters, in four pictures. 1: a center dot, a light guide circle and a cross; one dot at the top, bottom, left and right, like 12, 6, 9 and 3 on a clock. 2: one dot halfway between each pair, now 8 dots. 3: one dot halfway in each gap again, now 16 dots, in a new color so you can see them. Done: 16 even dots, the same size and the same gaps all the way round.</title>
