<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366" role="img" aria-labelledby="p0t">
<title id="p0t">Four bold festival palettes, each with black and white and a test tile on skin. Sunset: magenta, orange and yellow, warm neighbors, on deep skin with white painted under the colors. Electric: blue, teal and lime, cool neighbors, on light skin. Pop: purple and violet with yellow, opposites, on brown skin. Neon look: hot pink, cyan and lime, the brightest cake colors, on tan skin. Every tile has black lines between the colors and white dots.</title>
