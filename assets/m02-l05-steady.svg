<title id="s24t">Keep the skin still and your hand steady. 1: lay the hand flat on the table with the fingers a little apart, so the skin on the back of the hand is smooth. 2: rest the forearm on the table, inner side up. 3: on the face, rest your little finger on the jaw or chin while you paint the cheek.</title>
