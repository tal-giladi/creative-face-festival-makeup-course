<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="p1t">
<title id="p1t">Reading a glitter label in four checks. 1: it says cosmetic glitter for face and body. 2: it has an ingredient list. 3: the flakes are made of cellulose, a plant material, with mica and color CI numbers; a plastic glitter would say polyethylene terephthalate or PET. 4: the warning says avoid the eye area.</title>
<rect width="720" height="420" fill="#fbf8f4"/>
<rect x="40" y="30" width="400" height="360" rx="10" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><path d="M40 40Q40 30 50 30H430Q440 30 440 40V64H40Z" fill="#495057"/><text x="240" y="53" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">BACK OF THE JAR</text><text x="62" y="92" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2b2f3a">Cosmetic glitter</text><text x="62" y="114" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" fill="#2b2f3a">for face and body</text><text x="62" y="160" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#2b2f3a">Ingredients:</text><text x="62" y="180" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#2b2f3a">Cellulose, Mica (CI 77019),</text><text x="62" y="200" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#2b2f3a">Titanium dioxide (CI 77891),</text><text x="62" y="220" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#2b2f3a">Iron oxides (CI 77491)</text><text x="62" y="266" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#2b2f3a">Warning: avoid the eye area.</text><text x="62" y="286" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#2b2f3a">Patch test before use.</text><text x="62" y="306" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#2b2f3a">Keep away from small children.</text><text x="62" y="350" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280">Made in the EU · 5 g</text><circle cx="416" cy="96" r="14" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="416" y="101.3" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15.400000000000002" font-weight="700" fill="#d6336c">1</text><circle cx="416" cy="144" r="14" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="416" y="149.3" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15.400000000000002" font-weight="700" fill="#d6336c">2</text><circle cx="416" cy="178" r="14" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="416" y="183.3" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15.400000000000002" font-weight="700" fill="#d6336c">3</text><circle cx="416" cy="262" r="14" fill="#fff" stroke="#d6336c" stroke-width="2"/><text x="416" y="267.3" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15.400000000000002" font-weight="700" fill="#d6336c">4</text><rect x="56" y="165" width="74" height="22" rx="4" fill="none" stroke="#d6336c" stroke-width="2"/><rect x="56" y="247" width="206" height="22" rx="4" fill="none" stroke="#d6336c" stroke-width="2"/><text x="480" y="70" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">1  Sold for skin?</text><text x="480" y="90" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">   "Cosmetic", "face and body"</text><text x="480" y="140" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">2  Ingredient list?</text><text x="480" y="160" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">   No list: not for skin</text><text x="480" y="210" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">3  What are the flakes?</text><text x="480" y="230" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">   Cellulose: plant-based</text><text x="480" y="250" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">   PET / polyester: plastic</text><text x="480" y="300" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2b2f3a">4  Where may it go?</text><text x="480" y="320" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">   Read every warning</text>
</svg>
