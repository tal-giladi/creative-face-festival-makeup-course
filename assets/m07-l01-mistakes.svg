<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 284" width="918" height="284" role="img" aria-labelledby="s9t">
<title id="s9t">A good ring of dots and three mistakes, on paper. Good: 12 dots of the same size, the same gap between each, around a center dot. Avoid: dots that get smaller and smaller around the ring, because the tool was dipped only once. Avoid: dots placed one after another round the circle, so the gaps drift and the last gap is too big. Avoid: no guide circle, so the ring is wobbly and the center dot is off center.</title>
