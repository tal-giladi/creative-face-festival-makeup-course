<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" role="img" aria-labelledby="p26t">
<title id="p26t">What to take paint off with. Use: soap and warm water, micellar water, a gentle oil cleanser, fragrance-free baby wipes. Never on the face: rubbing alcohol, acetone or nail polish remover, solvent removers such as spirit gum remover.</title>
<rect width="920" height="450" fill="#fbf8f4"/>
