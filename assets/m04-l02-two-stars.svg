<title id="s11t">Two ways to paint a star. Top row, outline and fill: 1 mark five tips with small dots, 2 join them into a star outline, then fill it in with a flat brush. Bottom row, five teardrops: 1 press near the center and pull out to the top tip while lifting, 2 the same toward two more tips, then all five arms and a dot to fill the middle.</title>
