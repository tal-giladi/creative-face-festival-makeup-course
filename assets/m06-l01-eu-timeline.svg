<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="p2t">
<title id="p2t">EU microplastics restriction 2023/2055 and glitter. October 2023: loose plastic glitter for crafts, toys and similar uses banned from sale. Cosmetics with plastic glitter get longer: rinse-off products until 16 October 2027, leave-on products until 16 October 2029, make-up, lip and nail products until 16 October 2035, labeled as containing microplastics from 17 October 2031. Not covered: glitter that is biodegradable, water-soluble, natural, or inorganic such as glass, metal or mica.</title>
<rect width="760" height="440" fill="#fbf8f4"/>
<text x="380" y="34" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">EU rules on plastic glitter (Regulation 2023/2055)</text><text x="380" y="34" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2b2f3a">EU rules on plastic glitter (Regulation 2023/2055)</text><path d="M40 196H730" stroke="#adb5bd" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="196" r="11" fill="#e03131"/><path d="M80 184V172" stroke="#e03131" stroke-width="2"/><text x="80" y="166" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Oct 2023</text><text x="80" y="166" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#e03131">Oct 2023</text><text x="80" y="97" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">Loose plastic</text><text x="80" y="114" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">craft glitter</text><text x="80" y="131" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">banned from sale</text><circle cx="280" cy="196" r="11" fill="#f08c00"/><path d="M280 208V220" stroke="#f08c00" stroke-width="2"/><text x="280" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Oct 2027</text><text x="280" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#f08c00">Oct 2027</text><text x="280" y="254" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">Last date: plastic</text><text x="280" y="271" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">glitter in rinse-off</text><text x="280" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">cosmetics</text><circle cx="380" cy="196" r="11" fill="#f08c00"/><path d="M380 184V172" stroke="#f08c00" stroke-width="2"/><text x="380" y="166" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Oct 2029</text><text x="380" y="166" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#f08c00">Oct 2029</text><text x="380" y="97" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">Last date:</text><text x="380" y="114" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">leave-on</text><text x="380" y="131" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">cosmetics</text><circle cx="480" cy="196" r="11" fill="#1c7ed6"/><path d="M480 208V220" stroke="#1c7ed6" stroke-width="2"/><text x="480" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Oct 2031</text><text x="480" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c7ed6">Oct 2031</text><text x="480" y="254" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">Make-up must say</text><text x="480" y="271" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">"contains</text><text x="480" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">microplastics"</text><circle cx="680" cy="196" r="11" fill="#f08c00"/><path d="M680 184V172" stroke="#f08c00" stroke-width="2"/><text x="680" y="166" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Oct 2035</text><text x="680" y="166" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#f08c00">Oct 2035</text><text x="680" y="97" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">Last date: make-up,</text><text x="680" y="114" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">lip and nail</text><text x="680" y="131" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#2b2f3a">products</text><rect x="40" y="340" width="680" height="78" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text x="380" y="368" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">Not covered: glitter that is biodegradable, water-soluble,</text><text x="380" y="392" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#2b2f3a">natural, or inorganic (glass, metal, mica)</text>
</svg>
