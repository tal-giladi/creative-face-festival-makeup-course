<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="p28t">
<title id="p28t">Where face gems go. Purple guide lines: an arch just above each brow, along the brow bone, that curves down the temple; a line or cluster in the center of the forehead; a curve along the top of the cheekbone. Red hatched no-go zones: the eyelids and lash line, the skin just under the eyes, and the lips. Keep gems away from small children.</title>
<rect width="720" height="470" fill="#fbf8f4"/>
