<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" role="img" aria-labelledby="p48t">
<title id="p48t">Project 6 finished on medium skin: a bold festival eye on both eyes. Eye-safe black liner with a long, sharp wing; a cyan floating crease line above the natural crease; a soft magenta to violet blend on the brow bone; white and gold dots under each brow. Outside the eye area: three nested chevrons in magenta, purple and cyan above each brow tail, pointing up and out toward the temple, with a violet drop-shaped gem at the tip; magenta dots above the brow; a cyan dot trail from the temple down to the cheekbone with a small blue gem at its end. Nothing on the eyelid near the lashes, and no glitter or gems inside the eye area.</title>
<rect width="780" height="520" fill="#fbf8f4"/>
