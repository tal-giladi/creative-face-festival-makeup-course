<title id="s11t">What you can paint on yourself, on light skin. Front: the collarbones, the upper chest and the front of both shoulders, shaded green, are easy to reach in a mirror; reach across the body with your painting hand to the opposite shoulder. Back: the back of the shoulders and the shoulder blades, shaded orange, need a willing helper, or skip them.</title>
