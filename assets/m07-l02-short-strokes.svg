<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 982 254" width="982" height="254" role="img" aria-labelledby="s10t">
<title id="s10t">A straight-sided triangle on paper, in four pictures, and the mistake to avoid. 1: three anchor dots for the corners. 2: join the dots with short strokes, each about a third of a side, starting where the last one ended. 3: fill the triangle with yellow. Done: a clean black outline with a purple dot on each corner. Avoid: each side drawn in one long stroke without anchor dots, so the lines wobble and the corners miss each other.</title>
