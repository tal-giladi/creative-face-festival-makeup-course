<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="p11t">
<title id="p11t">Where glitter goes. Green zones: a crescent along each cheekbone up to the temple, the hairline, a small spot in the center of the forehead, and the collarbones. Red hatched no-go zones: the eyelids, the lash line and the skin just under the eyes, and the lips.</title>
