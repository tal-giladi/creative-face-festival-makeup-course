<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 233" width="1000" height="233" role="img" aria-labelledby="s3t">
<title id="s3t">The pressure stroke in three moves. 1 Touch: only the very tip touches the paper and makes a thin start. 2 Press: push down as you pull, the hairs spread and the line gets wide. 3 Lift: lift slowly as you keep pulling, the line gets thin again. Done: thin, thick, thin.</title>
