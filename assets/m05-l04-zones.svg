<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 445" width="880" height="445" role="img" aria-labelledby="p41t">
<title id="p41t">Close up of an eye on brown skin, showing what may go where. A yellow dashed zone from the brow down to the top of the cheekbone is the eye area: only products whose label says they are safe for the eyes go here. The blue lash line along the top of the eye: eye-safe liner, outside the lashes only. The red waterline, the wet inner rim of the lower lid: nothing goes here. Outside the dashed line: face paint, neon colors and glitter stay out there.</title>
<rect width="880" height="445" fill="#fbf8f4"/>
