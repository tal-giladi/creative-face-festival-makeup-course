<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="p0t">
<title id="p0t">The mixing wheel. Red, yellow and blue are the three starting colors. Between each pair is the color they make: red and yellow make orange, yellow and blue make green, blue and red make purple. White makes any color lighter, black makes it darker.</title>
