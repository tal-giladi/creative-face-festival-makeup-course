stroke-width="4" stroke-linejoin="round" opacity="0.9">purple</text><text x="116.4" y="150" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#2b2f3a">purple</text><circle cx="620" cy="190" r="40" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="620" y="196" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#2b2f3a">white</text><circle cx="620" cy="320" r="40" fill="#1d1d22"/><text x="620" y="326" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">black</text><text x="620" y="115" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">lighter</text><text x="620" y="115" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">lighter</text><text x="620" y="395" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">darker</text><text x="620" y="395" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">darker</text><text x="300" y="36" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9">Big circles: your 3 starting colors. Small: what two of them make.</text><text x="300" y="36" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#6b7280">Big circles: your 3 starting colors. Small: what two of them make.</text>
