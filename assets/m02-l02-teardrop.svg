<title id="s5t">The teardrop in three moves. 1 Touch: the tip touches where the round head will be. 2 Press: press down and the hairs spread into a round head. 3 Lift and pull: pull away while lifting slowly, the line thins to a sharp tail. Done: teardrops pointing in many directions.</title>
